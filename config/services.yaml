# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    auth.cookie.access_name: access_token
    auth.cookie.access_path: /api
    auth.cookie.refresh_name: refresh_token
    auth.cookie.refresh_path: /api/auth
    auth.cookie.secure: true
    auth.cookie.same_site: lax

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/*/Domain/Model/'
            - '../src/*/Domain/Exception/'
            - '../src/*/Application/**/*Command.php'
            - '../src/*/Application/**/*Query.php'
            - '../src/*/Application/**/*View.php'
            - '../src/*/Presentation/Api/*Resource.php'
            - '../src/*/Presentation/Api/*Input.php'
            - '../src/*/Presentation/Api/Output/'

    App\Identity\Domain\Repository\UserRepository: '@App\Identity\Infrastructure\Persistence\Doctrine\DoctrineUserRepository'
    App\Identity\Domain\Service\PasswordHasher: '@App\Identity\Infrastructure\Security\SymfonyPasswordHasher'
    App\Character\Domain\Repository\CharacterRepository: '@App\Character\Infrastructure\Persistence\Doctrine\DoctrineCharacterRepository'
    App\Character\Application\Player\PlayerNicks: '@App\Character\Infrastructure\Identity\IdentityPlayerNicks'
    App\Shared\Application\Security\CurrentUser: '@App\Identity\Infrastructure\Security\SymfonyCurrentUser'
    App\Combat\Domain\Random\RandomIntProvider: '@App\Combat\Infrastructure\Random\PhpRandomIntProvider'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

when@dev:
    parameters:
        auth.cookie.secure: false

when@test:
    parameters:
        auth.cookie.secure: false
