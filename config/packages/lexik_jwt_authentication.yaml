lexik_jwt_authentication:
    secret_key: '%env(resolve:JWT_SECRET_KEY)%'
    public_key: '%env(resolve:JWT_PUBLIC_KEY)%'
    pass_phrase: '%env(JWT_PASSPHRASE)%'
    token_ttl: 86400
    token_extractors:
        cookie:
            enabled: true
            name: '%auth.cookie.access_name%'
    set_cookies:
        '%auth.cookie.access_name%':
            path: '%auth.cookie.access_path%'
            secure: '%auth.cookie.secure%'
            samesite: '%auth.cookie.same_site%'
            httpOnly: true
    api_platform:
        check_path: /api/auth/login
        username_path: email
        password_path: password
