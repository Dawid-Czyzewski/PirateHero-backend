doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        types:
            user_id: App\Shared\Infrastructure\Persistence\Doctrine\Type\UserIdType
            character_id: App\Character\Infrastructure\Persistence\Doctrine\Type\CharacterIdType
            email: App\Identity\Infrastructure\Persistence\Doctrine\Type\EmailType
            nick: App\Identity\Infrastructure\Persistence\Doctrine\Type\NickType
            hashed_password: App\Identity\Infrastructure\Persistence\Doctrine\Type\HashedPasswordType

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
        use_savepoints: true
    orm:
        enable_native_lazy_objects: true
        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            Identity:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Identity/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Identity\Domain\Model'
                alias: Identity
            IdentitySecurity:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Identity/Infrastructure/Security'
                prefix: 'App\Identity\Infrastructure\Security'
                alias: IdentitySecurity
            Character:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Character/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Character\Domain\Model'
                alias: Character
        controller_resolver:
            auto_mapping: false

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
