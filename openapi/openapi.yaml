components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ApiEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          description: Endpoint-specific success payload
          additionalProperties: true
        meta:
          type: object
          properties:
            message:
              type: ["string", "null"]
    ProblemJson:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        violations:
          type: array
          items:
            type: object
            properties:
              propertyPath:
                type: string
              message:
                type: string
    UserRegisterInput:
      type: object
      required: [email, password, passwordRepeat, username, rulesAccepted, avatarName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        passwordRepeat:
          type: string
          minLength: 6
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: "^[a-zA-Z0-9_.-]+$"
        rulesAccepted:
          type: boolean
        avatarName:
          type: string
          minLength: 2
          maxLength: 64
          pattern: "^[a-z0-9_-]+$"
    LoginResult:
      type: object
      properties:
        user:
          type: object
          properties:
            id:
              type: string
            roles:
              type: array
              items:
                type: string
        token:
          type: string
        refresh_token:
          type: string
    RegisteredResult:
      type: object
      properties:
        registered:
          type: boolean
    ActivatedResult:
      type: object
      properties:
        activated:
          type: boolean
    TokenRefreshResult:
      type: object
      properties:
        token:
          type: string
    PasswordResetRequestResult:
      type: object
      properties:
        sent:
          type: boolean
    PasswordResetCompleteResult:
      type: object
      properties:
        reset:
          type: boolean
    ChangedResult:
      type: object
      properties:
        changed:
          type: boolean
    UpdatedResult:
      type: object
      properties:
        updated:
          type: boolean
    PurchasedResult:
      type: object
      properties:
        purchased:
          type: boolean
    UsedResult:
      type: object
      properties:
        used:
          type: boolean
    RefreshedResult:
      type: object
      properties:
        refreshed:
          type: boolean
    EquippedResult:
      type: object
      properties:
        equipped:
          type: boolean
    UnequippedResult:
      type: object
      properties:
        unequipped:
          type: boolean
    MovedResult:
      type: object
      properties:
        moved:
          type: boolean
    DeletedResult:
      type: object
      properties:
        deleted:
          type: boolean
    LeftResult:
      type: object
      properties:
        left:
          type: boolean
    TransferredResult:
      type: object
      properties:
        transferred:
          type: boolean
    CancelledResult:
      type: object
      properties:
        cancelled:
          type: boolean
    DeclinedResult:
      type: object
      properties:
        declined:
          type: boolean
    ApprovedResult:
      type: object
      properties:
        approved:
          type: boolean
    RejectedResult:
      type: object
      properties:
        rejected:
          type: boolean
    CanStartResult:
      type: object
      properties:
        canStart:
          type: boolean
    UnreadCount:
      type: object
      properties:
        unreadCount:
          type: integer
    RankingPagination:
      type: object
      required: [page, limit, total, totalPages]
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
    PlayerRankingEntry:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        famePoints:
          type: integer
        experiencePoints:
          type: integer
        level:
          type: ["object", "null"]
          properties:
            id:
              description: Level identifier
            name:
              type: string
        ship:
          type: ["object", "null"]
        equippedTitle:
          type: ["object", "null"]
    ShipRankingEntry:
      type: object
      properties:
        id:
          type: string
