          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: sortOrder
          in: query
          schema:
            type: string
            default: DESC
            enum: [ASC, DESC]
        - name: search
          in: query
          description: Optional search filter
          schema:
            type: string
        - name: sortBy
          in: query
          schema:
            type: string
            default: famePoints
            enum: [username, level, famePoints]
      responses:
        200:
          description: OK
          content:
            application/json:
