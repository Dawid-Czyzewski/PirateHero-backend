          type: integer
        memberCount:
          type: integer
        memberIds:
          type: array
          items:
            type: string
        requiresInvitation:
          type: boolean
        maxMembers:
          type: integer
        captainUsername:
          type: ["string", "null"]
    PlayersRankingData:
      type: object
      required: [items, pagination]
