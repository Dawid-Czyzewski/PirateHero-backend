# FameGame HTTP API (v1) — hand-maintained OpenAPI for product routes.
# Covers custom ApiResource + Symfony #[Route] endpoints used by the game client.
# Omits API Platform bare CRUD entity collections (fight_moves, store_slots, levels, …)
# and docs/entrypoint plumbing. Interactive fallback: GET /api/docs

openapi: 3.1.0
info:
  title: FameGame API
  version: "1.0.0"
  license:
    name: Proprietary
  description: |
    Product HTTP contracts for FameGameBackend.

    Success payloads use an envelope:
    `{ "data": <payload>, "meta": { "message": string|null } }`.

    Errors use RFC 7807 `application/problem+json`.
    Most `/api/*` routes require JWT (`Authorization: Bearer <token>`).
    Public auth routes set `security: []`.

servers:
  - url: /api
    description: API prefix

tags:
  - name: Auth
    description: "Login, register, password reset, token refresh"
  - name: Users
    description: "Profile, titles, coupons, skill points"
  - name: Refills
    description: "Energy, fight and training point refills"
  - name: Rankings
    description: Player and ship leaderboards
  - name: GameShop
    description: Composite shop / inventory / equip API
  - name: UserStore
    description: Legacy store endpoints (prefer GameShop)
  - name: Equipment
    description: Equip / unequip / storage move
  - name: Fights
    description: PvP duels
  - name: ShipFights
    description: Ship vs ship combat
  - name: Ships
    description: "Ship management, chat, invitations"
  - name: Activities
    description: "Missions, works, trainings"
  - name: Boosters
    description: Combat and shop boosters
  - name: Premium
    description: Mock premium diamond packs
  - name: Dungeons
    description: Dungeons and bestiary
  - name: Quests
    description: Quest list and claims
  - name: DailyRewards
    description: Daily login rewards
  - name: Games
    description: Mini-games

security:
  - bearerAuth: []

paths:
  /ships/fights/{fightId}:
    get:
      operationId: shipFightDetails
      tags: [ShipFights]
      summary: Ship fight details
      parameters:
        - name: fightId
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Details
          content:
            application/json:
              schema:
                allOf:
                  -
                    $ref: "#/components/schemas/ApiEnvelope"
                  -
                    type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ShipsFightDetails"
        401:
          description: Unauthenticated / invalid JWT
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemJson"
        403:
          description: Forbidden / business rule
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemJson"
  /ships/fights/can-start:
    get:
      operationId: shipFightCanStart
